<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MO&I ADMIN</title><style>body{background:#000;color:#fff;font-family:system-ui;padding:15px}input{width:100%;padding:12px;margin:6px 0;border-radius:8px;border:1px solid #333;background:#111;color:#fff;box-sizing:border-box}button{background:#d4af37;color:#000;padding:12px;border-radius:8px;font-weight:900;border:0;width:100%;margin-top:6px} .card{background:#111;padding:14px;border-radius:12px;margin-top:12px;border:1px solid #222} .small{font-size:11px;color:#888} .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style></head><body>
<div id="login"><h2 style="color:#d4af37">MO&I ADMIN LOGIN</h2><input id="pass" type="password" placeholder="Password"><button onclick="login()">INGIA</button><p class="small">Password: moi2026</p></div>
<div id="panel" style="display:none"><h2 style="color:#d4af37">ADMIN PANEL</h2><p class="small">Namba yako: 255624270641</p>
<div class="card"><h4>WhatsApp Number</h4><input id="wa" value="255624270641"><button onclick="saveWA()">HIFADHI NAMBA</button></div>
<div class="card"><h4>Ongeza Bidhaa</h4><input id="name" placeholder="Jina mf: Hoodie Black"><input id="price" placeholder="Bei mf: 55,000 TZS"><input id="img" placeholder="Link ya picha https://..."><button onclick="addP()">ONGEZA BIDHAA</button></div>
<div class="card"><h4>Bidhaa Zilopo (<span id="count">0</span>)</h4><div id="list"></div><button onclick="resetP()" style="background:#222;color:#fff;margin-top:15px">RUDISHA DEFAULT</button></div>
<a href="index.html" style="color:#d4af37;display:block;margin-top:20px;text-align:center">→ Angalia Website</a>
</div>
<script>
function login(){if(document.getElementById('pass').value==='moi2026'){document.getElementById('login').style.display='none';document.getElementById('panel').style.display='block';load();}else alert('Password sio sahihi')}
let defaults=[{name:"T-Shirt Premium Cotton",price:"35,000 TZS",img:"https://images.unsplash.com/photo-1521572163474-6864f9cf17ab"},{name:"Sneaker Luxury White",price:"120,000 TZS",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff"}];
let products=JSON.parse(localStorage.getItem('moi_products')||'null')||defaults;
function save(){localStorage.setItem('moi_products',JSON.stringify(products));load()}
function load(){document.getElementById('count').innerText=products.length;let l=document.getElementById('list');l.innerHTML='';products.forEach((p,i)=>{l.innerHTML+=`<div style="display:flex;gap:8px;margin:6px 0;align-items:center;background:#000;padding:6px;border-radius:6px"><img src="${p.img}" style="width:40px;height:40px;border-radius:6px;object-fit:cover"><div style="flex:1"><b style="font-size:12px">${p.name}</b><div style="color:#d4af37;font-size:11px">${p.price}</div></div><button onclick="del(${i})" style="width:auto;padding:4px 8px;background:#ff4444;color:#fff">X</button></div>`})}
function addP(){let n=document.getElementById('name').value,p=document.getElementById('price').value,i=document.getElementById('img').value;if(!n||!p||!i)return alert('Jaza vyote');products.unshift({name:n,price:p,img:i});save();document.getElementById('name').value='';document.getElementById('price').value='';document.getElementById('img').value='';alert('Imeongezwa!')}
function del(i){if(confirm('Futa?')){products.splice(i,1);save()}}
function resetP(){if(confirm('Rudisha default?')){localStorage.removeItem('moi_products');products=[...defaults];save()}}
function saveWA(){let w=document.getElementById('wa').value;localStorage.setItem('moi_wa',w);alert('Namba imehifadhiwa: '+w)}
</script></body></html>
